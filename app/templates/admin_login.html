{% extends "base.html" %}

{% block title %}Acceso Administrativo | SIDI{% endblock %}

{% block content %}
<div class="min-h-[75vh] flex items-center justify-center px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full space-y-8 bg-white p-8 rounded-2xl shadow-sm border border-slate-200">
        <div class="text-center">
            <div class="w-14 h-14 mx-auto rounded-2xl bg-primary text-white flex items-center justify-center text-2xl font-bold shadow-md">
                <i class="fa-solid fa-shield-halved"></i>
            </div>
            <h2 class="mt-4 text-2xl font-black text-slate-800 tracking-tight">Panel de Control SIDI</h2>
            <p class="mt-1 text-xs text-slate-500">Módulo Administrativo y Parametrización</p>
        </div>

        {% if aviso %}
        <div class="p-3.5 rounded-xl bg-amber-50 border border-amber-200 text-amber-900 text-xs flex items-center space-x-2.5 shadow-sm">
            <i class="fa-solid fa-clock-rotate-left flex-shrink-0 text-amber-600 text-base"></i>
            <span class="font-medium">{{ aviso }}</span>
        </div>
        {% endif %}

        {% if error %}
        <div class="p-3.5 rounded-xl bg-red-50 border border-red-200 text-red-700 text-xs flex items-center space-x-2">
            <i class="fa-solid fa-circle-exclamation flex-shrink-0"></i>
            <span>{{ error }}</span>
        </div>
        {% endif %}

        <form class="mt-8 space-y-5" action="/admin/login" method="POST" autocomplete="off">
            <div>
                <label for="username" class="block text-xs font-semibold uppercase text-slate-700 mb-1">Usuario</label>
                <div class="relative">
                    <input id="username" name="username" type="text" required autocomplete="username"
                           placeholder="Ingrese su usuario"
                           class="w-full pl-10 pr-3 py-2.5 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus-ring-primary text-sm text-slate-800">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                        <i class="fa-solid fa-user"></i>
                    </div>
                </div>
            </div>

            <div>
                <label for="password" class="block text-xs font-semibold uppercase text-slate-700 mb-1">Contraseña</label>
                <div class="relative">
                    <input id="password" name="password" type="password" required autocomplete="current-password"
                           placeholder="Ingrese su contraseña"
                           class="w-full pl-10 pr-3 py-2.5 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus-ring-primary text-sm text-slate-800">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                        <i class="fa-solid fa-lock"></i>
                    </div>
                </div>
            </div>

            <div>
                <button type="submit" class="w-full btn-primary py-2.5 px-4 rounded-lg font-bold text-sm shadow-md flex items-center justify-center space-x-2">
                    <i class="fa-solid fa-right-to-bracket"></i>
                    <span>Iniciar Sesión</span>
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
